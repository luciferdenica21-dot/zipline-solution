<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Страница не найдена — Zipline Solution</title>

  <meta name="robots" content="noindex, follow">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #070707;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      font-size: 120px;
      margin: 0;
      background: linear-gradient(135deg, #FF7A1A, #FF9F45);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 18px;
      color: rgba(255,255,255,0.7);
      margin: 20px 0;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, rgba(255,122,26,0.12), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,122,26,0.55);
      color: #FF9F45;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    a:hover {
      background: rgba(255,122,26,0.2);
      transform: translateY(-2px);
    }
  </style>
</head>
